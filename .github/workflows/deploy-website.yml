name: Deploy Website Content

on:
  workflow_dispatch:
  push:
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: webiktest

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify website content
        shell: bash
        run: |
          test -f website/index.html

      - name: Package website content
        shell: bash
        run: |
          cd website
          zip -r ../website.zip .

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy website package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: website.zip
